<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akiyama Mizuki Countdown</title>
    <style>
        body {
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Changed to min-height for better scrolling on phones */
            margin: 0;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }
        #countdown {
            font-size: 7rem;
            font-weight: bold;
            display: flex;
            flex-wrap: wrap; /* Allows numbers to wrap on small screens */
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        .time-box {
            text-align: center;
        }
        .label {
            font-size: 1.4rem;
            text-transform: normal;
            display: block;
            color: #fff;
        }
        .character-img {
            max-width: 1000px;
            width: 100%; /* Makes image shrink to fit the screen */
            height: auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* RESPONSIVE DESIGN FOR PHONES */
        @media (max-width: 768px) {
            #countdown {
                font-size: 3rem; /* Shrinks the 7rem font so it fits on a phone */
                gap: 15px;
            }
            .label {
                font-size: 1rem;
            }
            .character-img {
                max-width: 100%; /* Ensures the Mizuki image isn't wider than the phone */
            }
        }
    </style>
</head>
<body>

    <div id="countdown">
        <div class="time-box"><span id="days">00</span><span class="label">Days</span></div>
        <div class="time-box"><span id="hours">00</span><span class="label">Hours</span></div>
        <div class="time-box"><span id="minutes">00</span><span class="label">Minutes</span></div>
        <div class="time-box"><span id="seconds">00</span><span class="label">Seconds</span></div>
    </div>

    <img src="AkiyamaMizukiInfighting.png" alt="Akiyama Mizuki" class="character-img">

    <script>
        const targetDate = new Date("January 31, 2027 11:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');

            if (difference < 0) {
                clearInterval(interval);
                document.getElementById("countdown").innerHTML = "<h1>THE TIME HAS ARRIVED!</h1>";
            }
        }

        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
